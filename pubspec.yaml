name: ahorrapp
description: "A new Flutter project."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.5.0

dependencies:
  animate_do: ^4.2.0
  appwrite: ^22.0.0
  equatable: ^2.0.5
  fl_chart: ^1.1.1
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_bloc: ^9.1.1
  flutter_launcher_icons: ^0.14.4
  formz: ^0.8.0
  go_router: ^17.1.0
  intl: ^0.20.2
  local_auth: ^3.0.1
  package_info_plus: ^9.0.0
  shared_preferences: ^2.5.3
  isar: ^3.1.0+1
  isar_flutter_libs: ^3.1.0+1
  path_provider: ^2.1.4
  connectivity_plus: ^7.0.0
  workmanager: ^0.9.0+3
  get_it: ^9.2.1
  uuid: ^4.5.1
  url_launcher: ^6.3.1
  convex_bottom_bar: ^3.2.0
  google_mlkit_text_recognition: ^0.15.1
  google_mlkit_document_scanner: ^0.4.1
  image_picker: ^1.1.2
  cunning_document_scanner: ^1.4.0
  permission_handler: ^12.0.1
  http: ^1.2.2
  image: ^4.8.0
  share_plus: ^12.0.1
  pdf: ^3.11.1
  printing: ^5.13.2
  gal: ^2.3.2
  file_picker: ^10.3.10
  flutter_markdown: ^0.7.4
  flutter_web_plugins:
    sdk: flutter

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
  isar_generator: ^3.1.0+1
  build_runner: "^2.4.0"
  mocktail: ^1.0.4
  local_auth_platform_interface: ^1.1.0
  bloc_test: any

flutter:
  uses-material-design: true
  assets:
    - assets/

dependency_overrides:
  archive: ^4.0.7
  # Dart SDK 3.11 stable no tiene _macros: analyzer 6.5.0+ no resuelve.
  # isar_generator 3.1.0+1 necesita analyzer <7.0.0.
  # 6.4.1 es el único 6.x que funciona en este entorno.
  analyzer: "6.4.1"
  build_resolvers: "2.4.2"
  # dart_style 2.3.7+ usa MixinOnClause/onClause no disponibles en analyzer 6.4.1.
  # build_runner 2.4.14+ usa DartFormatter(languageVersion:) de dart_style 2.3.7+.
  # Forzamos 2.3.6 y también pin de build_runner a una versión anterior a esos cambios.
  dart_style: "2.3.6"
  build_runner: "2.4.11"
  test_api: 0.7.9
  matcher: 0.12.18

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/Logo.png" # <--- ¡IMPORTANTE! Verifica que esta ruta es donde tienes tu logo
  remove_alpha_ios: true # Apple no permite transparencias, esto las quita automáticamente
